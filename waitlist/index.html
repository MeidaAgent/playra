<!DOCTYPE html>
<!--
  ======================================================================
  Playra — Pioneer Waitlist Application
  ----------------------------------------------------------------------
  Independent registration portal for the Playra Pioneer waitlist.
  Does not bundle Phaser/XState to ensure ultra-fast, lightweight loading.
  ======================================================================
-->
<html lang="en" class="h-full w-full">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Playra — Join Official Waitlist Pioneer</title>
    <meta
      name="description"
      content="Join the exclusive Playra waitlist on Robinhood blockchain. Connect your wallet to secure early access and exclusive pioneer rewards."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Playra Waitlist | Beta Early Access" />
    <meta property="og:description" content="Join the Playra waitlist for updates and early access to the browser farming game." />
    <meta property="og:image" content="https://playra-iota.vercel.app/assets/docs_banner.gif" />
    <meta property="og:image:secure_url" content="https://playra-iota.vercel.app/assets/docs_banner.gif" />
    <meta property="og:image:type" content="image/gif" />
    <meta property="og:image:width" content="2048" />
    <meta property="og:image:height" content="768" />
    <meta property="og:image:alt" content="Playra farming game world" />
    <meta property="og:url" content="https://playra-iota.vercel.app/waitlist/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Playra Waitlist | Beta Early Access" />
    <meta name="twitter:description" content="Join the Playra waitlist for updates and early access to the browser farming game." />
    <meta name="twitter:image" content="https://playra-iota.vercel.app/assets/docs_banner.gif" />
    <link rel="icon" type="image/png" href="/tab_icon.png?v=6" />
    <link rel="shortcut icon" href="/favicon.ico?v=6" />
    <link rel="apple-touch-icon" href="/tab_icon.png?v=6" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Styles -->
    <link rel="stylesheet" href="/landing/tailwind_landing.css" />
    <link rel="stylesheet" href="/landing/styles_landing.css" />
    <style>
      input::-webkit-outer-spin-button,
      input::-webkit-inner-spin-button {
        -webkit-appearance: none !important;
        margin: 0 !important;
      }
      input[type="number"] {
        -moz-appearance: textfield !important;
        appearance: textfield !important;
      }
    </style>

    <!-- Polyfills for Web3 in Vite -->
    <script>
      window.global = window;
    </script>
    <script type="module">
      import process from "process";
      import { Buffer } from "buffer";
      import EventEmitter from "events";
      window.Buffer = Buffer;
      window.process = process;
      window.EventEmitter = EventEmitter;
    </script>
  </head>
  <body class="h-full w-full antialiased font-body">
    <div id="root" class="h-full w-full"></div>
    <script type="module" src="/src/waitlist/main.tsx"></script>
  </body>
</html>
